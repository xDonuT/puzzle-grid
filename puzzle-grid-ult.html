<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Puzzle Grid</title>
  <style>
    :root {
      --bg: #ebe6dc;
      --board-bg: #ddd5c8;
      --tile-radius: 16px;
      --gap: 8px;
      --shadow: 0 6px 20px rgba(60, 50, 40, 0.12);

      /* Richer pastels for better contrast against the board */
      --sword: #efb09a;
      --sword-icon: #b85a3f;
      --shield: #9fc4e0;
      --shield-icon: #3a6f9e;
      --hp: #e9a8b4;
      --hp-icon: #b8435c;
      --star: #efd48a;
      --star-icon: #b89420;
      --question: #c4b0e0;
      --question-icon: #6a4a9e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #5a5048;
      padding: 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .header { text-align: center; margin-bottom: 14px; }

    h1 {
      font-size: 1.4rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      color: #6b5f55;
      margin-bottom: 4px;
    }

    .stats {
      display: flex;
      gap: 28px;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #7a6e64;
    }

    .stat span {
      color: #5a5048;
      font-variant-numeric: tabular-nums;
    }

    .combo-display {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%) scale(0.85);
      z-index: 20;
      pointer-events: none;
      font-size: 1.05rem;
      font-weight: 800;
      color: #c96b52;
      opacity: 0;
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1.2, 0.36, 1);
      letter-spacing: 0.03em;
      text-shadow: 0 2px 10px rgba(255,255,255,0.85);
      white-space: nowrap;
    }
    .combo-display.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .combo-display.level-2 { font-size: 1.05rem; color: #c96b52; }
    .combo-display.level-3 { font-size: 1.15rem; color: #d4785c; }
    .combo-display.level-4 { font-size: 1.28rem; color: #c45a6a; }
    .combo-display.level-5 { font-size: 1.4rem; color: #b84a7a; text-shadow: 0 0 12px rgba(200, 120, 140, 0.35); }

    .board-wrap {
      position: relative;
      background: var(--board-bg);
      border-radius: 26px;
      padding: 14px;
      box-shadow: var(--shadow);
      position: relative;
      transition: box-shadow 0.4s ease, background 0.4s ease;
    }
    .board-wrap.combo-glow-1 {
      box-shadow: var(--shadow), 0 0 0 1px rgba(255, 220, 180, 0.25);
    }
    .board-wrap.combo-glow-2 {
      box-shadow: var(--shadow), 0 0 24px rgba(255, 200, 160, 0.28);
      background: #e0d6c6;
    }
    .board-wrap.combo-glow-3 {
      box-shadow: var(--shadow), 0 0 32px rgba(255, 180, 160, 0.35);
      background: #e4d2c4;
    }
    .board-wrap.combo-glow-4 {
      box-shadow: var(--shadow), 0 0 40px rgba(230, 150, 160, 0.4);
      background: #e6cec8;
    }
    .board-wrap.phase-fever {
      box-shadow: var(--shadow), 0 0 28px rgba(239, 212, 138, 0.5);
      background: #efe4c4;
    }
    .board-wrap.phase-impact {
      box-shadow: var(--shadow), 0 0 36px rgba(230, 140, 100, 0.48);
      background: #edd4c0;
    }
    body.phase-fever { background: #f3e9c8; }
    body.phase-impact { background: #f0dcc8; }
    .phase-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      display: none;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .phase-pill.show { display: inline-block; }
    .phase-pill:active { transform: scale(0.96); }
    .phase-pill.fever {
      background: rgba(239, 212, 138, 0.8);
      color: #6a5a18;
      border: 1px solid rgba(255,255,255,0.65);
    }
    .phase-pill.impact {
      background: rgba(230, 150, 110, 0.75);
      color: #6a3a28;
      border: 1px solid rgba(255,255,255,0.65);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: var(--gap);
      width: min(92vw, 360px);
      aspect-ratio: 6 / 7;
      position: relative;
      overflow: visible;
    }

    .tile {
      position: relative;
      border-radius: var(--tile-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-shadow:
        0 3px 0 rgba(60, 50, 40, 0.06),
        0 4px 12px rgba(60, 50, 40, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.45);
      will-change: transform, opacity, box-shadow;
      transform-origin: center center;
      transition: box-shadow 0.18s ease, filter 0.15s ease, transform 0.18s cubic-bezier(0.25, 0.8, 0.25, 1);
      touch-action: none;
    }
    .tile:active { cursor: grabbing; }

    /* Shared soft easing – sensory consistency */
    /* cubic-bezier(0.22, 0.9, 0.3, 1) used across fall / land / UI */

    /* Picked up – heavier, lifted piece */
    .tile.selected {
      z-index: 20;
      transform: scale(1.16) translateY(-8px);
      box-shadow:
        0 20px 36px rgba(60, 50, 40, 0.26),
        0 8px 14px rgba(60, 50, 40, 0.14),
        0 0 0 3px #fff,
        0 0 0 6px rgba(201, 184, 168, 0.75);
      filter: brightness(1.07);
    }

    /* Actively dragging */
    .tile.drag-preview {
      z-index: 25;
      opacity: 0.97;
      transition: none;
      box-shadow:
        0 26px 44px rgba(60, 50, 40, 0.3),
        0 12px 20px rgba(60, 50, 40, 0.16),
        0 0 0 3px #fff,
        0 0 0 6px rgba(201, 184, 168, 0.55);
    }

    /* Soft land when you release */
    .tile.dropping {
      z-index: 15;
      animation: tileDrop 0.36s cubic-bezier(0.22, 1.15, 0.36, 1) forwards;
    }

    .tile.swapping {
      z-index: 12;
      transition: transform 0.22s cubic-bezier(0.22, 0.9, 0.3, 1);
    }

    .tile.highlight {
      z-index: 9;
      animation: matchPulse 0.48s cubic-bezier(0.22, 0.9, 0.3, 1);
      box-shadow: 0 0 0 3px #fff, 0 0 22px 7px rgba(255, 220, 180, 0.9);
      filter: brightness(1.2) saturate(1.12);
    }

    .tile.matching {
      z-index: 8;
      animation: popOut 0.32s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .tile.falling {
      z-index: 6;
      transition: transform 0.36s cubic-bezier(0.22, 0.9, 0.3, 1);
    }

    .tile.landing {
      animation: landSquash 0.3s cubic-bezier(0.22, 1.2, 0.36, 1) forwards;
    }

    .tile.spawning {
      animation: spawnIn 0.3s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
    }

    /* Special (bloom) tile – soft premium glow */
    .tile.special {
      box-shadow:
        0 3px 0 rgba(60, 50, 40, 0.06),
        0 4px 12px rgba(60, 50, 40, 0.12),
        0 0 0 2px rgba(255, 255, 255, 0.7),
        0 0 14px 3px rgba(255, 230, 180, 0.55);
    }
    .tile.special::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: calc(var(--tile-radius) - 4px);
      border: 2px solid rgba(255, 255, 255, 0.55);
      pointer-events: none;
    }

    @keyframes tileDrop {
      0%   { transform: scale(1.16) translateY(-8px); }
      50%  { transform: scale(0.94, 1.06) translateY(3px); }
      75%  { transform: scale(1.04, 0.97) translateY(-1px); }
      100% { transform: scale(1) translateY(0); }
    }

    @keyframes matchPulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.12); }
      60%  { transform: scale(1.06); }
      100% { transform: scale(1.1); }
    }

    /* Inflate then pop – more weight before release */
    @keyframes popOut {
      0%   { transform: scale(1.1); opacity: 1; }
      30%  { transform: scale(1.28); opacity: 1; }
      55%  { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(0.1); opacity: 0; }
    }

    @keyframes landSquash {
      0%   { transform: scale(1.06, 0.9); }
      35%  { transform: scale(0.92, 1.1); }
      65%  { transform: scale(1.04, 0.96); }
      100% { transform: scale(1, 1); }
    }

    @keyframes spawnIn {
      0%   { transform: scale(0.2); opacity: 0; }
      60%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .tile svg {
      width: 54%;
      height: 54%;
      pointer-events: none;
    }

    .tile[data-type="sword"]    { background: var(--sword); }
    .tile[data-type="shield"]   { background: var(--shield); }
    .tile[data-type="hp"]       { background: var(--hp); }
    .tile[data-type="star"]     { background: var(--star); }
    .tile[data-type="question"] { background: var(--question); }

    .tile[data-type="sword"]    svg { fill: var(--sword-icon); }
    .tile[data-type="shield"]   svg { fill: var(--shield-icon); }
    .tile[data-type="hp"]       svg { fill: var(--hp-icon); }
    .tile[data-type="star"]     svg { fill: var(--star-icon); }
    .tile[data-type="question"] svg { fill: var(--question-icon); }

    /* Particles */
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 40;
      opacity: 0.9;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.78rem;
      opacity: 0.55;
      text-align: center;
      max-width: 300px;
      line-height: 1.4;
    }

    .score-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 750;
      font-size: 1.2rem;
      color: #c96b52;
      text-shadow: 0 1px 3px rgba(255,255,255,0.85);
      animation: scoreFloat 0.85s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
      z-index: 30;
      left: 50%;
      top: 40%;
    }
    .score-popup.big {
      font-size: 1.45rem;
      color: #d4785c;
    }
    .score-popup.huge {
      font-size: 1.7rem;
      color: #c45a6a;
      text-shadow: 0 0 10px rgba(200, 120, 140, 0.4), 0 1px 3px rgba(255,255,255,0.85);
    }

    @keyframes scoreFloat {
      0%   { transform: translate(-50%, -50%) scale(0.45); opacity: 0; }
      20%  { transform: translate(-50%, -75%) scale(1.25); opacity: 1; }
      70%  { transform: translate(-50%, -130%) scale(1.05); opacity: 1; }
      100% { transform: translate(-50%, -175%) scale(0.95); opacity: 0; }
    }

    /* ===== Combat frame: duel layout ===== */
    .combat {
      width: min(92vw, 400px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Player + enemy face each other in one arena */
    .duel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 8px;
      background: rgba(255, 255, 255, 0.32);
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .combatant {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    /* Enemy on left: HP bar on outer (left) side */
    .combatant.enemy {
      flex-direction: row;
    }

    /* Player on right: HP bar on outer (right) side */
    .combatant.player {
      flex-direction: row-reverse;
    }

    .combatant-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .portrait {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #e7dfd2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(60, 50, 40, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.65);
      position: relative;
      overflow: visible;
    }
    .portrait svg { width: 78%; height: 78%; }
    .portrait.ninja { background: #f0c4b4; }
    .portrait.wizard { background: #d8ccec; }
    .portrait.knight { background: #cfe0f0; }
    .portrait.enemy { background: #e0d0f0; }

    /* Short vertical HP on the back/outer side */
    .hp-vert {
      width: 7px;
      height: 48px;
      background: rgba(90, 80, 72, 0.12);
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hp-vert-fill {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(180deg, #e9a8b4, #d4785c);
      transition: height 0.35s cubic-bezier(0.22, 0.9, 0.3, 1);
    }
    .combatant.enemy .hp-vert-fill {
      background: linear-gradient(180deg, #c4b0e0, #8a6bb8);
    }

    .fighter-name {
      font-size: 0.72rem;
      font-weight: 750;
      color: #5a5048;
      max-width: 72px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .hp-num {
      font-size: 0.62rem;
      font-weight: 700;
      color: #8a7e74;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .duel-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .battle-log {
      font-size: 0.7rem;
      font-weight: 650;
      color: #5a5048;
      background: rgba(255,255,255,0.6);
      padding: 5px 10px;
      border-radius: 12px;
      max-width: 160px;
      text-align: center;
      line-height: 1.25;
      height: 2.5em;
      max-height: 2.5em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .ap-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ap-label {
      font-size: 0.6rem;
      font-weight: 800;
      color: #9a8e84;
      letter-spacing: 0.04em;
    }
    .ap-pips {
      display: flex;
      gap: 4px;
    }
    .ap-pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(90, 80, 72, 0.12);
      border: 1px solid rgba(255,255,255,0.5);
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .ap-pip.filled {
      background: #9fc4e0;
      box-shadow: 0 0 6px rgba(100, 150, 190, 0.4);
      border-color: rgba(255,255,255,0.85);
    }
    .ap-pip.empty {
      transform: scale(0.9);
      opacity: 0.55;
    }

    .ult-pips {
      display: flex;
      gap: 4px;
      justify-content: center;
    }
    .ult-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(90, 80, 72, 0.12);
      border: 1px solid rgba(255,255,255,0.5);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .ult-pip.filled {
      background: #efd48a;
      box-shadow: 0 0 6px rgba(200, 170, 60, 0.45);
      border-color: rgba(255,255,255,0.8);
    }

    .shield-badge {
      position: absolute;
      right: -6px;
      bottom: -6px;
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--shield);
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 2px 6px rgba(60, 50, 40, 0.12);
      z-index: 2;
    }
    .shield-badge svg {
      width: 10px;
      height: 10px;
      fill: var(--shield-icon);
      flex-shrink: 0;
    }
    .shield-badge .sh-num {
      font-size: 0.62rem;
      font-weight: 800;
      color: #3a6f9e;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* Score stays internal; combo theater is visible */
    #score, #combo { display: none; }

    .action-bar {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 8px;
      align-items: center;
    }

    .turn-pill {
      font-size: 0.75rem;
      font-weight: 750;
      color: #6b5f55;
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.55);
      padding: 8px 12px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .action-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.45);
      color: #5a5048;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(60, 50, 40, 0.06);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.end-btn {
      font-size: 0.9rem;
      font-weight: 800;
      padding: 12px 22px;
      min-width: 4.6em;
      background: rgba(239, 176, 154, 0.55);
      border-color: rgba(255,255,255,0.65);
      color: #5a3828;
      box-shadow: 0 3px 12px rgba(180, 100, 70, 0.18);
    }
    .action-btn.end-btn:active { transform: scale(0.95); }
    .action-btn.primary {
      background: #efb09a;
      color: #6a3a2c;
      border-color: rgba(255,255,255,0.5);
    }
    .action-btn:disabled { opacity: 0.45; cursor: default; }

    .spacer { flex: 1; }

    body {
      padding: 12px;
      justify-content: flex-start;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
    }

    .header { display: none; }

    /* Screens */
    .screen { display: none; width: min(92vw, 400px); }
    .screen.active { display: flex; flex-direction: column; align-items: center; gap: 14px; }

    .menu-title {
      font-size: 1.6rem;
      font-weight: 750;
      color: #6b5f55;
      letter-spacing: 0.03em;
      margin-top: 12px;
    }
    .menu-sub {
      font-size: 0.85rem;
      color: #9a8e84;
      margin-top: -6px;
    }

    .char-pick {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    .char-card {
      width: 96px;
      padding: 10px 8px;
      border-radius: 18px;
      background: rgba(255,255,255,0.4);
      border: 2px solid transparent;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .char-card:active { transform: scale(0.96); }
    .char-card.selected {
      border-color: #efb09a;
      box-shadow: 0 0 0 3px rgba(239, 176, 154, 0.35);
    }
    .char-card .portrait {
      width: 64px;
      height: 64px;
      margin: 0 auto 6px;
    }
    .char-card .fighter-name { max-width: none; font-size: 0.8rem; }

    .menu-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 260px;
    }
    .menu-actions .action-btn { width: 100%; padding: 12px; }

    .top-game-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .icon-btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.45);
      color: #5a5048;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
    }

    .portrait.ult-ready {
      box-shadow: 0 0 0 3px #fff, 0 0 16px 4px rgba(239, 212, 138, 0.75);
      cursor: pointer;
      animation: ultPulse 1.2s ease-in-out infinite;
    }
    @keyframes ultPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Ultimate impact juice */
    .portrait.ult-cast {
      animation: ultCastPulse 0.45s cubic-bezier(0.22, 1.2, 0.36, 1);
      z-index: 5;
    }
    @keyframes ultCastPulse {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .portrait.ult-flinch {
      animation: ultFlinch 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes ultFlinch {
      0%   { transform: translateX(0) scale(1); filter: brightness(1); }
      25%  { transform: translateX(-6px) scale(0.92); filter: brightness(1.25); }
      50%  { transform: translateX(5px) scale(0.94); filter: brightness(0.9); }
      100% { transform: translateX(0) scale(1); filter: brightness(1); }
    }
    .portrait.afterglow-aura {
      box-shadow: 0 0 0 3px #fff, 0 0 18px 5px rgba(239, 212, 138, 0.85);
    }
    .portrait.fracture-mark::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 2px dashed rgba(185, 70, 90, 0.75);
      pointer-events: none;
      animation: fracturePulse 1.4s ease-in-out infinite;
    }
    @keyframes fracturePulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .portrait.mortal-mark {
      filter: saturate(0.85);
    }
    .portrait.mortal-mark::after {
      content: "💔";
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 0.7rem;
      line-height: 1;
      filter: none;
    }
    .ult-flash {
      position: absolute;
      inset: -8px;
      border-radius: 30px;
      pointer-events: none;
      z-index: 25;
      opacity: 0;

    .ult-flash.ninja { background: radial-gradient(circle, rgba(201, 107, 82, 0.55), transparent 70%); }
    .ult-flash.wizard { background: radial-gradient(circle, rgba(155, 126, 200, 0.6), transparent 70%); }
    .ult-flash.knight { background: radial-gradient(circle, rgba(159, 180, 204, 0.55), transparent 70%); }
    .ult-flash.go {
      animation: ultFlashAnim 0.55s cubic-bezier(0.22, 0.9, 0.3, 1) forwards;
    }
    @keyframes ultFlashAnim {

      25%  { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.15); }
    }

  </style>
</head>
<body>
  <!-- MAIN MENU -->
  <div class="screen active" id="screen-menu">
    <div class="menu-title">Puzzle Grid</div>
    <div class="menu-sub">Pick your fighter</div>
    <div class="char-pick" id="charPick"></div>
    <div class="menu-actions">
      <button type="button" class="action-btn primary" id="btnStart">New Run</button>
      <button type="button" class="action-btn" id="btnContinue" style="display:none">Continue Floor <span id="continueFloor">1</span></button>
      <button type="button" class="action-btn" id="btnMenuSettings">Settings</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
  <div class="combat">
    <div class="top-game-bar" style="justify-content:space-between;align-items:center">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <div class="turn-pill" id="floorPill" style="margin:0">Floor <span id="floorNum">1</span>/30</div>
        <div class="phase-pill" id="phasePill"></div>
      </div>
      <button type="button" class="icon-btn" id="btnGameSettings" title="Settings">⚙</button>
    </div>

    <!-- Duel arena: enemy ← center → player -->
    <div class="duel">
      <div class="combatant enemy">
        <div class="hp-vert" title="Enemy HP">
          <div class="hp-vert-fill" id="enemyHpFill" style="height:100%"></div>
        </div>
        <div class="combatant-main">
          <div class="portrait enemy" id="enemyPortrait" aria-hidden="true"></div>
          <div class="fighter-name" id="enemyName">Rival</div>
          <div class="hp-num" id="enemyHpText">30/30</div>
        </div>
      </div>

      <div class="duel-center">
        <div class="battle-log" id="battleLog">Ready</div>
        <div class="ap-row" title="Action points">
          <span class="ap-label">AP</span>
          <div class="ap-pips" id="apPips" aria-label="Action points">
            <div class="ap-pip" data-pip="1"></div>
            <div class="ap-pip" data-pip="2"></div>
            <div class="ap-pip" data-pip="3"></div>
          </div>
        </div>
        <div class="ult-row">
          <div class="ult-pips" id="ultPips" aria-label="Ultimate charge">
            <div class="ult-pip" data-pip="1"></div>
            <div class="ult-pip" data-pip="2"></div>
            <div class="ult-pip" data-pip="3"></div>
            <div class="ult-pip" data-pip="4"></div>
            <div class="ult-pip" data-pip="5"></div>
          </div>
          <div class="charge-num" id="chargeNum" title="Ultimate charge">0/10</div>
        </div>
      </div>

      <div class="combatant player">
        <div class="hp-vert" title="Your HP">
          <div class="hp-vert-fill" id="playerHpFill" style="height:100%"></div>
        </div>
        <div class="combatant-main">
          <div class="portrait ninja" id="playerPortrait" aria-hidden="true">
            <div class="shield-badge" id="shieldBadge" title="Shield">
              <svg viewBox="0 0 24 24"><path d="M12 2.8L5.5 5.7v5.6c0 4.7 3.2 8.2 6.5 9.6 3.3-1.4 6.5-4.9 6.5-9.6V5.7L12 2.8z"/></svg>
              <span class="sh-num" id="shieldNum">0</span>
            </div>
          </div>
          <div class="fighter-name" id="playerName">Ninja</div>
          <div class="hp-num" id="playerHpText">30/30</div>
        </div>
      </div>
    </div>

    <!-- Tappable status tray -->
    <div class="status-tray" id="statusTray">
      <div class="status-tray-side" id="enemyStatusTray"></div>
      <div class="status-tray-side player-side" id="playerStatusTray"></div>
    </div>

    <!-- Hidden for JS refs (score/combo theater still tracks internally) -->
    <span id="score" hidden>0</span>
    <span id="combo" hidden>0</span>
    <!-- Board -->
    <div class="board-wrap">
      <div class="combo-display" id="comboText"></div>
      <div class="grid" id="grid" aria-label="5 by 5 puzzle grid"></div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <div class="turn-pill" id="turnPill">Turn <span id="turnNum">1</span></div>
      <div class="spacer"></div>
      <button type="button" class="action-btn" id="btnShuffle" title="Shuffle board">Shuffle</button>
      <button type="button" class="action-btn primary end-btn" id="btnEnd" title="End turn">End</button>
    </div>
  </div>
  </div><!-- /screen-game -->

  <!-- SETTINGS OVERLAY (tabs: Game | Admin) -->
  <div class="overlay" id="settingsOverlay">
    <div class="panel">
      <h2>Settings</h2>
      <div class="seg settings-tabs" id="settingsTabs" style="margin-bottom:12px;width:100%;justify-content:center">
        <button type="button" data-tab="game" class="on">Game</button>
        <button type="button" data-tab="admin">Admin</button>
      </div>

      <div id="tabGame">

        <div class="row">
          <label>Mode</label>
          <div class="seg" id="diffSeg">

          </div>

      </div>

        <div class="row"><label>Shield per 3-match</label><input type="number" id="admShield" min="0" max="99" /></div>
        <div class="row"><label>Shield max</label><input type="number" id="admShieldMax" min="0" max="99" /></div>
        <div class="row"><label>Enemy attack</label><input type="number" id="admEnemyAtk" min="0" max="99" /></div>
        <div class="row"><label>Ult base damage</label><input type="number" id="admUlt" min="0" max="99" /></div>

        <div class="row"><label>Star Fever turn</label><input type="number" id="admFever" min="1" max="30" /></div>

      </div>
    </div>
  </div>

  <!-- Floor banner -->
  <div class="overlay" id="floorBannerOverlay">
    <div class="banner-card" id="floorBannerCard">
      <div class="banner-kicker" id="floorBannerKicker">Floor</div>
      <div class="banner-title" id="floorBannerTitle">1</div>
      <div class="banner-sub" id="floorBannerSub"></div>
    </div>
  </div>

  <!-- Ultimate ready popup -->

    <div class="banner-card ult-banner">
      <div class="banner-title">🔥 ULTIMATE READY!</div>

  <div class="overlay" id="gameOverOverlay">
    <div class="panel" style="text-align:center">
      <h2 id="gameOverTitle">Victory</h2>
      <p id="gameOverMsg" style="color:#7a6e64;font-size:0.9rem;margin:8px 0 12px;font-weight:600"></p>

        <button type="button" class="action-btn primary" id="btnGoRetry">Next Floor</button>
      </div>
    </div>
  </div>

  <!-- BATTLE LOG HISTORY (last 2) -->
  <div class="overlay" id="logOverlay">
    <div class="panel">
      <h2>Recent Moves</h2>
      <div id="logHistory"></div>
      <div class="panel-actions" style="margin-top:12px">
        <button type="button" class="action-btn primary" id="btnLogClose" style="width:100%">Close</button>
      </div>

  <div class="overlay" id="infoOverlay">
    <div class="panel">
      <h2 id="infoTitle">Fighter</h2>
      <div id="infoBody"></div>
      <div class="panel-actions" style="margin-top:14px">
        <button type="button" class="action-btn primary" id="btnInfoClose" style="width:100%">Close</button>
      </div>
    </div>
  </div>

  <script>
    const ROWS = 7;
    const COLS = 6;
    const TYPES = ["sword", "shield", "hp", "star", "question"];
    const MIN_MATCH = 3;

    // Global settings (difficulty, mute, admin numbers)
    const SETTINGS_KEY = "puzzleGridSettings_v1";
    const settings = {
      muted: false,
      volume: 1.0, // 0–1 master SFX gain (max by default)
      difficulty: "normal", // easy | normal | hard
      swordDmg: 3,
      starDmg: 4,
      healAmt: 3,
      shieldOn3: 2,      // 3-match shields → 2 stacks
      shieldMax: 18,
      enemyAtk: 5,
      ultDmg: 14,      // fallback; scaled ult still uses 12 + (charge-6)*2
      ultNeed: 6,
      ultMaxCharge: 10,
      feverTurn: 6,
      impactTurn: 11
    };

    function persistSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          muted: settings.muted,
          volume: settings.volume,
          difficulty: settings.difficulty,
          swordDmg: settings.swordDmg,
          starDmg: settings.starDmg,
          healAmt: settings.healAmt,
          shieldOn3: settings.shieldOn3,
          shieldMax: settings.shieldMax,
          enemyAtk: settings.enemyAtk,
          ultDmg: settings.ultDmg,
          ultNeed: settings.ultNeed,
          feverTurn: settings.feverTurn,
          impactTurn: settings.impactTurn
        }));
      } catch (_) {}
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return;
        const o = JSON.parse(raw);
        if (typeof o.muted === "boolean") settings.muted = o.muted;
        if (typeof o.volume === "number") settings.volume = Math.max(0, Math.min(1, o.volume));
        if (o.difficulty) settings.difficulty = o.difficulty;
        ["swordDmg","starDmg","healAmt","shieldOn3","shieldMax","enemyAtk","ultDmg","ultNeed","feverTurn","impactTurn"].forEach(k => {
          if (typeof o[k] === "number") settings[k] = o[k];
        });
      } catch (_) {}
    }
    loadSettings();

    function sfxVol(base) {
      if (settings.muted) return 0;
      // Aggressive master scale for mobile speakers
      const scaled = (base || 0.4) * settings.volume * 3.5;
      return Math.max(0, Math.min(1, scaled));
    }

    const COLORS = {
      sword:    { bg: "#efb09a", icon: "#b85a3f" },
      shield:   { bg: "#9fc4e0", icon: "#3a6f9e" },

        <path d="M12 5.6L8.2 7.4v4.3c0 2.8 1.8 5 3.8 5.9 2-0.9 3.8-3.1 3.8-5.9V7.4L12 5.6z" fill="rgba(255,255,255,0.22)"/>

    const gridEl = document.getElementById("grid");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");

    function setComboTheater(level) {
      // Combo text personality + scale
      comboTextEl.classList.remove("level-2", "level-3", "level-4", "level-5", "show");
      if (level >= 2) {
        const labels = { 2: "Nice!", 3: "Great!", 4: "Amazing!", 5: "Incredible!", 6: "Unreal!", 7: "Divine!" };
        comboTextEl.textContent = labels[Math.min(level, 7)] || "Divine!";
        const lv = Math.min(level, 5);
        comboTextEl.classList.add("show", `level-${lv}`);

      boardWrapEl.classList.remove("combo-glow-1", "combo-glow-2", "combo-glow-3", "combo-glow-4");
      if (level >= 5) boardWrapEl.classList.add("combo-glow-4");
      else if (level >= 4) boardWrapEl.classList.add("combo-glow-3");
      else if (level >= 3) boardWrapEl.classList.add("combo-glow-2");
      else if (level >= 2) boardWrapEl.classList.add("combo-glow-1");
    }

    function clearComboTheater() {
      comboTextEl.classList.remove("show", "level-2", "level-3", "level-4", "level-5");
      boardWrapEl.classList.remove("combo-glow-1", "combo-glow-2", "combo-glow-3", "combo-glow-4");
    }

    let board = [];
    let specials = []; // parallel 2D bool – bloom specials from 4+ matches
    let cells = [];
    let score = 0;
    let combo = 0;
    let busy = false;
    let pointer = null; // {row, col, x, y, startX, startY}

    // ---------- Soft Web Audio ----------
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    // ---------- Haptics (Vibration API) ----------
    // Short, subtle patterns. Silently does nothing when unsupported
    // (iOS Safari, most desktops, reduced-motion / battery savers).
    const canVibrate = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";

    function haptic(pattern) {
      if (!canVibrate) return;
      try { navigator.vibrate(pattern); } catch (_) {}
    }

    function hapticLight()  { haptic(12); }          // pickup
    function hapticMatch()  { haptic(26); }          // single match
    function hapticTap()    { haptic(18); }          // UI button
    function hapticCombo(level) {                    // cascade / combo
      if (level >= 3) haptic([28, 35, 32]);
      else haptic([20, 28, 20]);
    }
    function hapticDrop()   { haptic(10); }          // soft land

    // Soft, pleasant "pop" – short sine + gentle noise-like transient
    function playPop(pitch = 1, volume = 0.55) {
      volume = sfxVol(volume);
      if (volume <= 0) return;
      ensureAudio();
      const t = audioCtx.currentTime;

      // Main soft tone
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(380 * pitch, t);
      osc.frequency.exponentialRampToValueAtTime(180 * pitch, t + 0.09);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.15);

      // Tiny high click for definition (very soft)
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(900 * pitch, t);
      gain2.gain.setValueAtTime(0.0001, t);
      gain2.gain.exponentialRampToValueAtTime(volume * 0.25, t + 0.005);
      gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(t);
      osc2.stop(t + 0.05);
    }

    function playUiClick(kind = "tap") {
      // Short soft tick for buttons
      const vol = sfxVol(kind === "end" ? 0.55 : 0.42);
      if (vol <= 0) return;
      ensureAudio();
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      const f0 = kind === "end" ? 320 : kind === "primary" ? 420 : 520;
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + 0.07);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.1);
      if (kind === "end") haptic(28);
      else hapticTap();
    }

    function playSwap() {
      // Same gooey family – quieter, slightly higher
      playGooeyPlop(1.15, 0.45);
    }

    // Soft gooey “plop / blob” – rounded, muted, easy on the ears
    // Technique: low sine pitch-drop + tiny filtered noise transient, heavy lowpass, gentle envelopes
    function playGooeyPlop(pitch = 1, volume = 0.65) {
      volume = sfxVol(volume);
      if (volume <= 0) return;
      ensureAudio();
      const t = audioCtx.currentTime;

      // --- Body: soft low sine that quickly drops (the “blob”) ---
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      const bodyFilter = audioCtx.createBiquadFilter();

      osc.type = "sine";
      osc.frequency.setValueAtTime(220 * pitch, t);
      osc.frequency.exponentialRampToValueAtTime(70 * pitch, t + 0.14);

      bodyFilter.type = "lowpass";
      bodyFilter.frequency.setValueAtTime(650, t);
      bodyFilter.frequency.exponentialRampToValueAtTime(200, t + 0.18);
      bodyFilter.Q.value = 0.8;

      oscGain.gain.setValueAtTime(0.0001, t);
      oscGain.gain.linearRampToValueAtTime(volume, t + 0.022);
      oscGain.gain.exponentialRampToValueAtTime(volume * 0.4, t + 0.1);
      oscGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);

      osc.connect(bodyFilter);
      bodyFilter.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.32);

      // --- Tiny noise “plop” transient ---
      const bufferSize = Math.floor(audioCtx.sampleRate * 0.06);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.8);
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = "lowpass";
      noiseFilter.frequency.value = 420;
      noiseFilter.Q.value = 0.5;

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.0001, t);
      noiseGain.gain.linearRampToValueAtTime(volume * 0.28, t + 0.008);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(t);
    }

    function playMatch(count) {
      const base = 0.92 + Math.min(count, 5) * 0.03;
      playGooeyPlop(base, 0.55);
      hapticMatch();
    }

    function playCombo(level) {
      playGooeyPlop(1.0 + level * 0.04, 0.55);
      hapticCombo(level);
    }

    function hapticUlt() {
      haptic([32, 45, 28, 40, 50]);
    }

    // Distinct ult sting — brighter than match plops
    function playUltSfx(cls = "ninja") {
      const volume = sfxVol(0.72);
      if (volume <= 0) {
        hapticUlt();
        return;
      }
      ensureAudio();
      const t = audioCtx.currentTime;
      const base = cls === "wizard" ? 520 : cls === "knight" ? 280 : 400;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = cls === "knight" ? "triangle" : "sine";
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.exponentialRampToValueAtTime(base * (cls === "wizard" ? 1.6 : 0.55), t + 0.22);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(cls === "wizard" ? 2200 : 1400, t);
      filter.frequency.exponentialRampToValueAtTime(600, t + 0.28);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(volume * 0.45, t + 0.12);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.4);

      // High sparkle layer
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(base * 2.2, t);
      osc2.frequency.exponentialRampToValueAtTime(base * 0.9, t + 0.15);
      gain2.gain.setValueAtTime(0.0001, t);
      gain2.gain.exponentialRampToValueAtTime(volume * 0.35, t + 0.01);
      gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(t);
      osc2.stop(t + 0.2);

      hapticUlt();
    }

    // ---------- helpers ----------
    const rand = () => TYPES[Math.floor(Math.random() * TYPES.length)];
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const idx = (r, c) => r * COLS + c;

    function makeTile(type, r, c) {
      const el = document.createElement("div");
      el.className = "tile";
      el.dataset.type = type;
      el.dataset.row = r;
      el.dataset.col = c;
      el.innerHTML = ICONS[type];
      return el;
    }

    function setType(el, type) {
      el.dataset.type = type;
      el.innerHTML = ICONS[type];
    }

    function getCell(r, c) {
      return cells[idx(r, c)];
    }

    // ---------- particles (soft blob-like bursts) ----------
    function spawnParticles(r, c, type) {
      const el = getCell(r, c);
      const rect = el.getBoundingClientRect();
      const gridRect = gridEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2 - gridRect.left;
      const cy = rect.top + rect.height / 2 - gridRect.top;
      const color = COLORS[type]?.icon || "#c9b8a8";
      const softColor = COLORS[type]?.bg || "#e8e0d4";

      const count = 8 + Math.floor(Math.random() * 5);
      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const size = 6 + Math.random() * 9;
        p.style.width = size + "px";
        p.style.height = size + "px";
        // Mix icon + tile color for softer look
        p.style.background = i % 2 === 0 ? color : softColor;
        p.style.left = cx + "px";
        p.style.top = cy + "px";
        p.style.marginLeft = -size / 2 + "px";
        p.style.marginTop = -size / 2 + "px";
        p.style.borderRadius = "50%";
        p.style.filter = "blur(0.4px)";

        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.7;
        const dist = 22 + Math.random() * 32;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 8;

        gridEl.appendChild(p);

        const anim = p.animate([
          { transform: "translate(0,0) scale(0.9)", opacity: 0.85 },
          { transform: `translate(${tx * 0.6}px, ${ty * 0.5}px) scale(1.05)`, opacity: 0.7, offset: 0.35 },
          { transform: `translate(${tx}px, ${ty}px) scale(0.2)`, opacity: 0 }
        ], {
          duration: 420 + Math.random() * 200,
          easing: "cubic-bezier(0.15, 0.75, 0.3, 1)",
          fill: "forwards"
        });

        anim.onfinish = () => p.remove();
      }
    }

    // ---------- build ----------
    function build() {
      gridEl.innerHTML = "";
      board = [];
      specials = [];
      cells = [];

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        specials[r] = [];
        for (let c = 0; c < COLS; c++) {
          let t;
          do { t = rand(); }
          while (
            (c >= 2 && board[r][c-1] === t && board[r][c-2] === t) ||
            (r >= 2 && board[r-1][c] === t && board[r-2][c] === t)
          );
          board[r][c] = t;
          specials[r][c] = false;
          const el = makeTile(t, r, c);
          cells.push(el);
          gridEl.appendChild(el);
        }
      }
    }

    // ---------- match detection ----------
    // Also collects runs of length >= 4 so we can spawn bloom specials
    function findMatches() {
      const mark = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      const specialSpawns = []; // {r, c, type}
      let any = false;

      // Horizontal runs
      for (let r = 0; r < ROWS; r++) {
        let n = 1;
        for (let c = 1; c <= COLS; c++) {
          if (c < COLS && board[r][c] === board[r][c-1] && board[r][c] !== null) n++;
          else {
            if (n >= MIN_MATCH) {
              any = true;
              for (let k = 0; k < n; k++) mark[r][c-1-k] = true;
              if (n >= 4) {
                const mid = c - 1 - Math.floor((n - 1) / 2);
                specialSpawns.push({ r, c: mid, type: board[r][mid] });
              }
            }
            n = 1;
          }
        }
      }
      // Vertical runs
      for (let c = 0; c < COLS; c++) {
        let n = 1;
        for (let r = 1; r <= ROWS; r++) {
          if (r < ROWS && board[r][c] === board[r-1][c] && board[r][c] !== null) n++;
          else {
            if (n >= MIN_MATCH) {
              any = true;
              for (let k = 0; k < n; k++) mark[r-1-k][c] = true;
              if (n >= 4) {
                const mid = r - 1 - Math.floor((n - 1) / 2);
                specialSpawns.push({ r: mid, c, type: board[mid][c] });
              }
            }
            n = 1;
          }
        }
      }
      return { mark, any, specialSpawns };
    }

    // Shape analysis for combat multipliers
    // Charged: 4+ in a line → ×2
    // Star line: 5+ in a line → ×1.5 (charged takes priority if 4+)
    // Cross: tile in both H and V match → ×1.5
    function analyzeShapes(mark) {
      let maxRun = 0;
      // Horizontal runs
      for (let r = 0; r < ROWS; r++) {
        let n = 0, prev = null;
        for (let c = 0; c <= COLS; c++) {
          const t = c < COLS && mark[r][c] ? board[r][c] : null;
          if (t && t === prev) n++;
          else {
            if (n >= MIN_MATCH) maxRun = Math.max(maxRun, n);
            n = t ? 1 : 0;
            prev = t;
          }
        }
      }
      // Vertical runs
      for (let c = 0; c < COLS; c++) {
        let n = 0, prev = null;
        for (let r = 0; r <= ROWS; r++) {
          const t = r < ROWS && mark[r][c] ? board[r][c] : null;
          if (t && t === prev) n++;
          else {
            if (n >= MIN_MATCH) maxRun = Math.max(maxRun, n);
            n = t ? 1 : 0;
            prev = t;
          }
        }
      }
      // Cross / T: cell that is in both a horizontal and vertical run of 3+
      let isCross = false;
      for (let r = 0; r < ROWS && !isCross; r++) {
        for (let c = 0; c < COLS && !isCross; c++) {
          if (!mark[r][c] || !board[r][c]) continue;
          const t = board[r][c];
          let h = 1, v = 1;
          for (let cc = c - 1; cc >= 0 && mark[r][cc] && board[r][cc] === t; cc--) h++;
          for (let cc = c + 1; cc < COLS && mark[r][cc] && board[r][cc] === t; cc++) h++;
          for (let rr = r - 1; rr >= 0 && mark[rr][c] && board[rr][c] === t; rr--) v++;
          for (let rr = r + 1; rr < ROWS && mark[rr][c] && board[rr][c] === t; rr++) v++;
          if (h >= MIN_MATCH && v >= MIN_MATCH) isCross = true;
        }
      }

      let mult = 1;
      let tags = [];
      let charged = false;
      if (maxRun >= 4) {
        mult = 2;
        charged = true;
        tags.push(maxRun >= 5 ? "charged-star" : "charged");
      } else if (maxRun >= 5) {
        mult = 1.5;
        tags.push("star");
      }
      if (isCross && mult < 2) {
        mult = Math.max(mult, 1.5);
        tags.push("cross");
      } else if (isCross && mult >= 2) {
        tags.push("cross");
      }
      if (!tags.length) tags.push("normal");
      return { mult, charged, isCross, maxRun, tags };
    }

    // ---------- core loop ----------
    async function resolveBoard() {
      while (true) {
        let { mark, any, specialSpawns } = findMatches();
        if (!any) {
          combo = 0;
          comboEl.textContent = "0";
          clearComboTheater();
          break;
        }

        // Expand clear if any matched tile is a bloom special (3x3)
        const bloomExtra = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (mark[r][c] && specials[r][c]) {
              for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                  const nr = r + dr, nc = c + dc;
                  if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !mark[nr][nc] && board[nr][nc]) {
                    mark[nr][nc] = true;
                    bloomExtra.push({ r: nr, c: nc });
                  }
                }
              }
            }
          }
        }

        combo++;
        comboEl.textContent = combo;

        let count = 0;
        const matchedList = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (mark[r][c]) {
              count++;
              matchedList.push({ r, c, type: board[r][c], wasSpecial: specials[r][c] });
            }
          }
        }

        const shape = analyzeShapes(mark);
        // Combat effects from this clear (cascades also apply)
        applyMatchCombat(matchedList, false, shape);

        // Charged (4+) refunds 1 AP on player match
        if (shape.charged && combat.playerTurn) {
          combat.ap = Math.min(AP_MAX, combat.ap + 1);
          refreshCombatUI();
        }

        if (combo >= 2) {
          setComboTheater(combo);
          playCombo(combo);
        } else {
          playMatch(count);
        }

        // 1. Pre-match highlight + anticipation pause
        for (const { r, c } of matchedList) {
          getCell(r, c).classList.add("highlight");
        }
        await sleep(420);

        // 2. Particles + pop
        for (const { r, c, type } of matchedList) {
          const el = getCell(r, c);
          el.classList.remove("highlight");
          el.classList.add("matching");
          spawnParticles(r, c, type);
        }
        await sleep(300);

        // 3. Clear matched (remember special spawns that aren't on cleared? they are on matched cells)
        // Filter special spawns: only keep if that cell was part of a 4+ run (it will be cleared, then we place special after gravity... 
        // Better: place specials after clear but before gravity on the cleared cell, then gravity carries them.
        const spawnsToPlace = [];
        for (const s of specialSpawns) {
          if (mark[s.r][s.c] && s.type) {
            spawnsToPlace.push(s);
          }
        }

        for (const { r, c } of matchedList) {
          board[r][c] = null;
          specials[r][c] = false;
          const el = getCell(r, c);
          el.classList.remove("matching", "special");
          el.style.opacity = "0";
        }

        // Place bloom specials on cleared cells (center of 4+ runs) before gravity
        for (const s of spawnsToPlace) {
          board[s.r][s.c] = s.type;
          specials[s.r][s.c] = true;
          const el = getCell(s.r, s.c);
          setType(el, s.type);
          el.classList.add("special");
          el.style.opacity = "1";
          el.classList.remove("matching");
        }

        await applyGravityAndFill();
      }
    }

    async function applyGravityAndFill() {
      const drops = [];

      for (let c = 0; c < COLS; c++) {
        const stack = [];
        for (let r = ROWS - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            stack.push({ r, type: board[r][c], special: specials[r][c] });
          }
        }
        let write = ROWS - 1;
        // Clear column first
        for (let r = 0; r < ROWS; r++) {
          board[r][c] = null;
          specials[r][c] = false;
        }
        for (const item of stack) {
          if (item.r !== write) {
            drops.push({ fromR: item.r, toR: write, c, type: item.type, special: item.special });
          }
          board[write][c] = item.type;
          specials[write][c] = item.special;
          write--;
        }
      }

      const tileH = getCell(0, 0).offsetHeight;
      const gap = parseFloat(getComputedStyle(gridEl).gap) || 8;
      const step = tileH + gap;

      for (const d of drops) {
        const el = getCell(d.fromR, d.c);
        el.classList.add("falling");
        // Stretch while falling for weight
        const dy = (d.toR - d.fromR) * step;
        el.style.transform = `translateY(${dy}px) scale(0.94, 1.08)`;
      }

      await sleep(drops.length ? 360 : 40);
      rebuildVisual();

      // Landing squash on tiles that fell
      const landed = [];
      for (const d of drops) {
        const el = getCell(d.toR, d.c);
        el.classList.add("landing");
        landed.push(el);
      }
      if (landed.length) {
        await sleep(280);
        landed.forEach(el => el.classList.remove("landing"));
      }

      const newEls = [];
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          if (board[r][c] === null) {
            board[r][c] = rand();
            specials[r][c] = false;
            const el = getCell(r, c);
            setType(el, board[r][c]);
            el.classList.remove("special");
            el.style.opacity = "1";
            el.classList.add("spawning");
            newEls.push(el);
          } else {
            getCell(r, c).style.opacity = "1";
          }
        }
      }

      if (newEls.length) playPop(0.7, 0.4);
      await sleep(newEls.length ? 290 : 40);
      newEls.forEach(el => el.classList.remove("spawning"));
    }

    function rebuildVisual() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const el = getCell(r, c);
          el.className = "tile" + (specials[r][c] ? " special" : "");
          el.style.transform = "";
          el.style.opacity = board[r][c] ? "1" : "0";
          el.dataset.row = r;
          el.dataset.col = c;
          if (board[r][c]) setType(el, board[r][c]);
        }
      }
    }

    // ---------- swap ----------
    async function trySwap(r1, c1, r2, c2) {
      if (busy || !combat.playerTurn) return;
      if (combat.ap <= 0) return;
      if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;

      busy = true;
      playSwap();

      const el1 = getCell(r1, c1);
      const el2 = getCell(r2, c2);
      const tileH = el1.offsetHeight;
      const gap = parseFloat(getComputedStyle(gridEl).gap) || 8;
      const step = tileH + gap;
      const dx = (c2 - c1) * step;
      const dy = (r2 - r1) * step;

      el1.classList.add("swapping");
      el2.classList.add("swapping");
      el1.style.transform = `translate(${dx}px, ${dy}px)`;
      el2.style.transform = `translate(${-dx}px, ${-dy}px)`;
      await sleep(210);

      const tmp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = tmp;
      const tmpSp = specials[r1][c1];
      specials[r1][c1] = specials[r2][c2];
      specials[r2][c2] = tmpSp;

      el1.classList.remove("swapping");
      el2.classList.remove("swapping");
      el1.style.transform = "";
      el2.style.transform = "";
      setType(el1, board[r1][c1]);
      setType(el2, board[r2][c2]);
      el1.classList.toggle("special", !!specials[r1][c1]);
      el2.classList.toggle("special", !!specials[r2][c2]);

      const { any } = findMatches();
      if (any) {
        combat.ap = Math.max(0, combat.ap - 1);
        refreshCombatUI();
        await resolveBoard();
      } else {
        await sleep(50);
        el1.classList.add("swapping");
        el2.classList.add("swapping");
        el1.style.transform = `translate(${dx}px, ${dy}px)`;
        el2.style.transform = `translate(${-dx}px, ${-dy}px)`;
        await sleep(180);

        board[r2][c2] = board[r1][c1];
        board[r1][c1] = tmp;
        specials[r2][c2] = specials[r1][c1];
        specials[r1][c1] = tmpSp;

        el1.classList.remove("swapping");
        el2.classList.remove("swapping");
        el1.style.transform = "";
        el2.style.transform = "";
        setType(el1, board[r1][c1]);
        setType(el2, board[r2][c2]);
        el1.classList.toggle("special", !!specials[r1][c1]);
        el2.classList.toggle("special", !!specials[r2][c2]);
      }

      busy = false;
    }

      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const t = el.closest(".tile");
      if (!t || t.dataset.row === undefined) return null;
      return { row: +t.dataset.row, col: +t.dataset.col, el: t };

    function applyDropEffect(el) {
      el.classList.remove("selected", "drag-preview");
      el.style.transform = "";
      el.classList.add("dropping");
      playDrop();
      setTimeout(() => el.classList.remove("dropping"), 360);

    gridEl.addEventListener("pointerdown", e => {
      if (busy || combat.ap <= 0) return;
      const t = tileAt(e.clientX, e.clientY);
      if (!t) return;

      ensureAudio();

      pointer = {
        row: t.row,
        col: t.col,
        x: e.clientX,
        y: e.clientY,
        startX: e.clientX,
        startY: e.clientY
      };
      t.el.classList.add("selected");
      playPickup();
      e.preventDefault();
    });

    window.addEventListener("pointermove", e => {
      if (!pointer || busy) return;
      const el = getCell(pointer.row, pointer.col);
      const dx = e.clientX - pointer.startX;
      const dy = e.clientY - pointer.startY;

      // Follow + soft tilt so it feels like a physical piece in your hand
      const max = 34;
      const follow = 0.55;
      const clampedX = Math.max(-max, Math.min(max, dx * follow));
      const clampedY = Math.max(-max, Math.min(max, dy * follow));

      // Subtle rotation based on horizontal drag
      const tilt = Math.max(-9, Math.min(9, dx * 0.06));

      el.classList.add("drag-preview");
      el.style.transform = `translate(${clampedX}px, ${clampedY - 8}px) scale(1.14) rotate(${tilt}deg)`;
    });

    window.addEventListener("pointerup", e => {
      if (!pointer) return;
      const el = getCell(pointer.row, pointer.col);

      const dx = e.clientX - pointer.x;
      const dy = e.clientY - pointer.y;
      const ax = Math.abs(dx), ay = Math.abs(dy);
      const th = 22;

      let tr = pointer.row, tc = pointer.col;
      let willSwap = false;

      if (ax > th || ay > th) {
        if (ax > ay) tc += dx > 0 ? 1 : -1;
        else tr += dy > 0 ? 1 : -1;

        if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
          willSwap = true;
        }
      }

      if (willSwap) {
        // Clean up hold state before swap animation takes over
        el.classList.remove("selected", "drag-preview");
        el.style.transform = "";
        trySwap(pointer.row, pointer.col, tr, tc);
      } else {
        // Soft drop back into place
        applyDropEffect(el);
      }

      pointer = null;
    });

    window.addEventListener("pointercancel", () => {
      if (pointer) {
        const el = getCell(pointer.row, pointer.col);
        applyDropEffect(el);
        pointer = null;

    });

    function renderStatusTray() {

      function fill(tray, icons) {
