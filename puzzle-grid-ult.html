    // Shield active: half damage to shield stacks, half to HP
    // Ninja dodge / afterglow, Wizard reflect
    function dealDamageToPlayer(raw) {
      let dmg = Math.max(0, raw | 0);
      if (dmg <= 0) return;

      // Ninja: first hit of battle always dodged; then 20% dodge
      if (combat.playerClass === "ninja") {
        if (!combat.firstHitDodged) {
          combat.firstHitDodged = true;
          setLog("Shadow Step · Dodge!");
          return;
        }
        if (Math.random() < 0.20) {
          setLog("Shadow Step · Dodge!");
          return;
        }
      }

      // Afterglow: 50% less damage for 1 turn after ult
      if (combat.afterglowTurns > 0) {
        dmg = Math.round(dmg * 0.5);
      }

      // Wizard Arcane Reflection: 30% of pre-mitigation dmg reflected as true dmg
      if (combat.playerClass === "wizard" && dmg > 0) {
        const reflected = Math.max(1, Math.round(dmg * combat.reflectPct));
        // True damage — ignore enemy shield
        combat.enemyHp = Math.max(0, combat.enemyHp - reflected);
        // Reflect can kill the enemy mid-enemy-turn; register the kill now
        if (combat.enemyHp <= 0) checkGameOver();
      }

      if (combat.shield > 0) {
        const toShield = Math.min(combat.shield, Math.floor(dmg / 2));
        const toHp = dmg - toShield;
        combat.shield -= toShield;
        if (toHp > 0) combat.playerHp = Math.max(0, combat.playerHp - toHp);
      } else {
        combat.playerHp = Math.max(0, combat.playerHp - dmg);
      }
    }

    function dealDamageToEnemy(raw, opts = {}) {
      let dmg = Math.max(0, raw | 0);
      if (dmg <= 0) return;

      // Mark amplifier (Ninja cross): +15% per stack, max 3
      if (combat.markStacks > 0) {
        dmg = Math.round(dmg * (1 + 0.15 * Math.min(3, combat.markStacks)));
      }

      const trueDmg = !!opts.trueDmg; // ultimates & fracture
      const before = combat.enemyHp;
      if (trueDmg || combat.enemyShield <= 0) {
        combat.enemyHp = Math.max(0, combat.enemyHp - dmg);
      } else {
        const toShield = Math.min(combat.enemyShield, Math.floor(dmg / 2));
        const toHp = dmg - toShield;
        combat.enemyShield -= toShield;
        if (toHp > 0) combat.enemyHp = Math.max(0, combat.enemyHp - toHp);
      }
      if (combat.enemyHp < before && combat.eliteKit && typeof combat.eliteKit.onDamaged === "function") {
        combat.eliteKit.onDamaged();
      }
    }

    // Shield stacks: 3 tiles → settings.shieldOn3 (default 2), each extra +1
    function shieldFromCount(n) {
      if (n < 3) return 0;
      return settings.shieldOn3 + Math.max(0, n - 3);
    }

    function describeClear(matchedList) {
      const counts = { sword: 0, star: 0, hp: 0, shield: 0, question: 0 };
      for (const { type } of matchedList) if (counts[type] != null) counts[type]++;
      const parts = [];
      if (counts.sword) parts.push(`${counts.sword} sword`);
      if (counts.star) parts.push(`${counts.star} star`);
      if (counts.hp) parts.push(`${counts.hp} heart`);
      if (counts.shield) parts.push(`${counts.shield} shield`);
      if (counts.question) parts.push(`${counts.question} ?`);
      return parts.join(" · ") || "match";
    }

    function convertRandomTiles(count, toType) {
      const empties = [];
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (board[r][c] && board[r][c] !== toType) empties.push({ r, c });
      for (let i = empties.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [empties[i], empties[j]] = [empties[j], empties[i]];
      }
      const n = Math.min(count, empties.length);
      for (let i = 0; i < n; i++) {
        const { r, c } = empties[i];
        board[r][c] = toType;
        specials[r][c] = false;
      }
      if (n > 0) rebuildVisual();
      return n;
    }

    function applyMatchCombat(matchedList, forEnemy = false, shape = { mult: 1, charged: false, tags: ["normal"] }) {
      let dmg = 0, heal = 0, shieldTiles = 0, questionCount = 0, swordCount = 0, healCount = 0, shieldCount = 0;
      const sigType = playerSignature();
      let hasSigMatch = false;
      let sigSwordCount = 0, sigShieldCount = 0, sigHpCount = 0;
      const mult = shape.mult || 1;
      const phase = getPhase();
      const fever = phase === "fever";
      const isCharged = !!shape.charged || (shape.tags && shape.tags.includes("charged"));
      const isCross = shape.tags && shape.tags.includes("cross");
      const isStar = shape.tags && shape.tags.includes("star");
      const bitsExtra = [];

      for (const { type } of matchedList) {
        if (type === "sword") {
          dmg += settings.swordDmg;
          swordCount++;
          if (!forEnemy && sigType === "sword") { hasSigMatch = true; sigSwordCount++; }
        } else if (type === "star") {
          dmg += settings.starDmg;
        } else if (type === "hp") {
          healCount++;
          // Knight signature: +6 per potion tile
          if (!forEnemy && sigType === "hp") {
            heal += 6;
            hasSigMatch = true;
            sigHpCount++;
          } else {
            heal += settings.healAmt;
          }
        } else if (type === "shield") {
          shieldTiles++;
          shieldCount++;
          if (!forEnemy && sigType === "shield") { hasSigMatch = true; sigShieldCount++; }
        } else if (type === "question") {
          questionCount++;
        }
      }

      // Star Fever: signature damage/shield boosted; heals only +50% (not full double)
      if (!forEnemy && fever && hasSigMatch) {
        if (sigType === "sword") dmg += settings.swordDmg * sigSwordCount;
        if (sigType === "hp") heal += Math.round(6 * sigHpCount * 0.5);
        if (sigType === "shield") shieldTiles += Math.ceil(sigShieldCount * 0.5);
      }

      // Damage gets full shape mult; heals only partial (prevents 60+ HP clears)
      dmg = Math.round(dmg * mult);
      const healMult = mult > 1 ? Math.min(1.25, 1 + (mult - 1) * 0.5) : 1;
      heal = Math.round(heal * healMult);

      // Base shield from tiles
      let sh = 0;
      if (shieldTiles >= 3) {
        // Wizard signature: +6 per 3-match
        if (!forEnemy && combat.playerClass === "wizard" && hasSigMatch) {
          sh = 6 + Math.max(0, shieldTiles - 3);
        } else {
          sh = shieldFromCount(shieldTiles);
        }
      }
      if (mult > 1 && sh > 0) sh = Math.round(sh * Math.min(1.25, mult));

      // Ninja lifesteal (toned down)
      let lifeSteal = 0;
      if (!forEnemy && combat.playerClass === "ninja" && swordCount > 0) {
        lifeSteal = swordCount * (isCharged ? 3 : 2);
        heal += lifeSteal;
      }

      // Knight signature: +1 Fracture once per clear (not per tile)
      if (!forEnemy && combat.playerClass === "knight" && hasSigMatch && sigHpCount > 0) {
        combat.fractureStacks = Math.min(5, combat.fractureStacks + 1);
        combat.fractureTurns = Math.max(combat.fractureTurns, 2);
        bitsExtra.push(`Fracture ${combat.fractureStacks}`);
      }

      // ---- Hero shape bonuses (player only) ----
      if (!forEnemy) {
        const cls = combat.playerClass;
        if (cls === "wizard") {
          if (isStar) {
            sh += 12;
            const n = convertRandomTiles(3, "shield");
            bitsExtra.push(`Arcane Nova +12 shield · ${n}→🛡️`);
          }
          if (isCross) {
            combat.manaLockTurns = Math.max(combat.manaLockTurns, 2);
            bitsExtra.push("Mana Lock 2t");
          }
          if (isCharged) {
            const steal = Math.min(3, combat.enemyShield);
            if (steal > 0) {
              combat.enemyShield -= steal;
              const shielded = applyShielding(steal);
              const dmgFromOverflow = steal - shielded;
              let stealMsg = `Mana Steal ${steal}`;
              if (dmgFromOverflow > 0) stealMsg += ` (+${dmgFromOverflow} overflow dmg)`;
              bitsExtra.push(stealMsg);
            }
          }
        } else if (cls === "ninja") {
          if (isStar) {
            combat.ap = Math.min(AP_MAX, combat.ap + 2);
            const n = convertRandomTiles(3, "sword");
            bitsExtra.push(`Shadow Dance +2 AP · ${n}→⚔️`);
          }
          if (isCross) {
            combat.markStacks = Math.min(3, combat.markStacks + 1);
            bitsExtra.push(`Mark ${combat.markStacks}`);
          }
          if (isCharged) {
            heal += 4;
            bitsExtra.push("Shadow Strike +4 HP");
          }
        } else if (cls === "knight") {
          if (isStar) {
            const bonus = combat.fractureStacks * 5;
            if (bonus > 0) {
              dealDamageToEnemy(bonus, { trueDmg: true });
              bitsExtra.push(`Earthquake ${bonus}`);
            }
            const n = convertRandomTiles(2, "hp");
            bitsExtra.push(`${n}→❤️`);
          }
          if (isCross) {
            combat.fractureStacks = Math.min(5, combat.fractureStacks + 2);
            combat.fractureTurns = Math.max(combat.fractureTurns, 2);
            bitsExtra.push(`Sunder Fracture ${combat.fractureStacks}`);
          }
         if (isCharged) {
  combat.fractureStacks = Math.min(5, combat.fractureStacks + 2);
  combat.fractureTurns = Math.max(combat.fractureTurns, 2);
  bitsExtra.push("Shattering Blow +2 Fracture");
}
        }
      }

      // Empower / blind / weaken
      if (!forEnemy && dmg > 0) {
        if (combat.empowerNext) {
          dmg = Math.round(dmg * 1.5);
          combat.empowerNext = false;
        }
        if (combat.blindNext) {
          dmg = Math.round(dmg * 0.5);
          combat.blindNext = false;
        }
        if (combat.weakenNextSword && swordCount > 0) {
          dmg = Math.max(0, dmg - 2);
          combat.weakenNextSword = false;
        }
      }

      // Mortal Wound: enemy healing halved
      if (forEnemy && combat.mortalWoundTurns > 0 && heal > 0) {
        heal = Math.floor(heal / 2);
      }

      const label = describeClear(matchedList);
      const shapeTag = (shape.tags && shape.tags[0] !== "normal") ? shape.tags.join("+") : "";
      const mysteryBits = [];

      // One mystery roll per clear (not per ? tile) — less swingy
      if (!forEnemy && questionCount > 0) {
        const res = rollMysteryEffect();
        mysteryBits.push(`❓ ${res.isBuff ? "Buff" : "Debuff"}: ${res.label} (${res.detail})`);
      }

      const maxSh = settings.shieldMax + run.bonusShieldMax;

      if (forEnemy) {
        if (dmg > 0) dealDamageToPlayer(dmg);
        if (heal > 0) healEnemy(heal);
        // Mana Lock: enemy cannot gain shield
        if (sh > 0 && combat.manaLockTurns <= 0) {
          combat.enemyShield = Math.min(maxSh, combat.enemyShield + sh);
        }
        const bits = [label];
        if (shapeTag) bits.push(shapeTag);
        if (dmg) bits.push(`${dmg} dmg`);
        if (heal) bits.push(`+${heal} HP`);
        if (sh && combat.manaLockTurns <= 0) bits.push(`+${sh} shield`);
        else if (sh && combat.manaLockTurns > 0) bits.push("shield locked");
        setLog(`Rival: ${bits.join(" · ")}`);
      } else {
        if (dmg > 0) dealDamageToEnemy(dmg);
        let healApplied = 0, shieldApplied = 0;
        if (heal > 0) healApplied = applyHealing(heal, healCount);
        if (sh > 0) shieldApplied = applyShielding(sh, shieldCount);
        if (hasSigMatch) {
          const before = combat.sigBank;
          combat.sigBank = Math.min(settings.ultMaxCharge, combat.sigBank + 1);
          if (before < settings.ultNeed && combat.sigBank >= settings.ultNeed) {
            showUltReadyBanner();
          }
        }
        const bits = [label];
        if (shapeTag) bits.push(shapeTag + (mult !== 1 ? ` ×${mult}` : ""));
        if (fever && hasSigMatch) bits.push("Fever ×2");
        if (dmg) bits.push(`${dmg} dmg`);
        if (heal) {
          bits.push(`+${healApplied} HP`);
          if (heal > healApplied) bits.push(`(+${heal - healApplied} dmg to enemy)`);
        }
        if (sh) {
          bits.push(`+${shieldApplied} shield (${combat.shield})`);
          if (sh > shieldApplied) bits.push(`(+${sh - shieldApplied} dmg to enemy)`);
        }
        if (shape.charged) bits.push("AP refund");
        if (hasSigMatch) bits.push(`charge ${combat.sigBank}/${settings.ultMaxCharge}`);
        if (bitsExtra.length) bits.push(...bitsExtra);
        if (mysteryBits.length) bits.push(...mysteryBits);
        setLog(bits.join(" · "));
        // Trash talk: big clear / charged / cross → rival reacts
        const isBig = (shape.charged || (shape.tags && (shape.tags.includes("cross") || shape.tags.includes("star"))) || matchedList.length >= 6 || dmg >= 12);
        if (isBig) {
          setTimeout(() => {
            if (!gameOver && combat.enemyHp > 0) sayVoice("bigHit", { chance: 0.55, force: false });
          }, 420);
        } else if (dmg > 0 || heal > 0) {
          setTimeout(() => maybeEnemyLowVoice(), 400);
        }
      }
      refreshCombatUI();
      checkGameOver();
    }

    // Score a hypothetical clear for AI (higher = better for rival)
    function scoreMatchList(list) {
      let s = 0;
      let shields = 0;
      for (const { type } of list) {
        if (type === "sword") s += settings.swordDmg * 2;
        else if (type === "star") s += settings.starDmg * 2;
        else if (type === "hp") s += settings.healAmt;
        else if (type === "shield") shields++;
      }
      s += shieldFromCount(shields) * 3;
      s += list.length; // prefer bigger clears
      return s;
    }

    function collectMatchesFromMark(mark) {
      const list = [];
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (mark[r][c]) list.push({ r, c, type: board[r][c] });
      return list;
    }

    // Find best adjacent swap for current board (for normal/hard AI)
    function findBestSwap() {
      let best = null;
      let bestScore = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const neighbors = [[r, c + 1], [r + 1, c]];
          for (const [nr, nc] of neighbors) {
            if (nr >= ROWS || nc >= COLS) continue;
            // swap
            const t = board[r][c]; board[r][c] = board[nr][nc]; board[nr][nc] = t;
            const { mark, any } = findMatches();
            if (any) {
              const list = collectMatchesFromMark(mark);
              const sc = scoreMatchList(list);
              if (sc > bestScore) {
                bestScore = sc;
                best = { r1: r, c1: c, r2: nr, c2: nc, score: sc };
              }
            }
            // revert
            board[nr][nc] = board[r][c]; board[r][c] = t;
          }
        }
      }
      return best;
    }

    function pickEnemyMove() {
      const diff = settings.difficulty;
      if (diff === "easy") {
        // pure random adjacent
        for (let tries = 0; tries < 20; tries++) {
          const r1 = Math.floor(Math.random() * ROWS);
          const c1 = Math.floor(Math.random() * COLS);
          const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
          const d = dirs[Math.floor(Math.random() * 4)];
          const r2 = r1 + d[0], c2 = c1 + d[1];
          if (r2 >= 0 && r2 < ROWS && c2 >= 0 && c2 < COLS) return { r1, c1, r2, c2 };
        }
        return null;
      }
      // normal + hard: search for real matches
      const best = findBestSwap();
      if (best) return best;
      // hard: if no match, still try a structured random
      if (diff === "hard") {
        for (let tries = 0; tries < 30; tries++) {
          const r1 = Math.floor(Math.random() * ROWS);
          const c1 = Math.floor(Math.random() * COLS);
          const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
          const d = dirs[Math.floor(Math.random() * 4)];
          const r2 = r1 + d[0], c2 = c1 + d[1];
          if (r2 >= 0 && r2 < ROWS && c2 >= 0 && c2 < COLS) return { r1, c1, r2, c2 };
        }
      }
      return null;
    }

    async function enemyTurn() {
      if (busy) return;
      busy = true;
      combat.playerTurn = false;
      let enemyAp = AP_MAX;

      // Knight Fracture: true dmg at start of enemy turn
      if (combat.fractureStacks > 0 && combat.fractureTurns > 0) {
        const fDmg = combat.fractureStacks * 2;
        dealDamageToEnemy(fDmg, { trueDmg: true });
        setLog(`Fracture · ${fDmg} true dmg`);
        refreshCombatUI();
        await sleep(350);
        if (combat.enemyHp <= 0) {
          checkGameOver();
          return;
        }
      }

      // Boss ultimate charge
      if (combat.bossKit) {
        combat.enemyUltCharge += 1;
        if (combat.enemyUltCharge >= combat.enemyUltNeed) {
          sayVoice("enemySpecial", { force: true });
          await sleep(320);
          setLog(`${combat.enemyName}: ${combat.bossKit.ultName}!`);
          await sleep(400);
          combat.bossKit.ultFn();
          combat.enemyUltCharge = 0;
          refreshCombatUI();
          await sleep(400);
          if (combat.playerHp <= 0) {
            checkGameOver();
            return;
          }
          maybePlayerLowVoice();
        } else if (combat.enemyUltCharge === combat.enemyUltNeed - 1) {
          setLog(`${combat.enemyName} ultimate charging…`);
          await sleep(280);
        }
      }

      applyArchetypeTurnStart();
      refreshCombatUI();

      // --- Normal Enemy Special Move ---
      if (!combat.bossKit && !combat.eliteKit) {
        combat.enemySpecialCharge += 1;
        if (combat.enemySpecialCharge >= combat.enemySpecialNeed) {
          combat.enemySpecialCharge = 0;
          combat.enemySpecialNeed = 4 + Math.floor(Math.random() * 2);
          // Use special: Heavy Strike (150% damage)
          sayVoice("enemySpecial", { force: true });
          await sleep(280);
          const spDmg = Math.max(1, Math.round(enemyAtkForFloor(run.floor) * diffStats().atkMul * 1.5));
          dealDamageToPlayer(spDmg);
          applyArchetypePassiveOnHit();
          setLog(`${combat.enemyName} uses Power Strike! ${spDmg} dmg`);
          refreshCombatUI();
          if (combat.playerHp <= 0) { checkGameOver(); return; }
          maybePlayerLowVoice();
          // Small pause so the player sees the special
          await sleep(400);
        } else if (combat.enemySpecialCharge === combat.enemySpecialNeed - 1) {
          setLog(`${combat.enemyName} is charging a special...`);
          await sleep(300);
        }
      }

      setLog(`${combat.enemyName} is thinking…`);
      const archAtk = (combat.enemyArchetype && combat.enemyArchetype.atkMul) || 1;
      const eliteAtk = (combat.eliteKit && combat.eliteKit.atkMul) || 1;
      const atkScale = archAtk * eliteAtk;

      for (let i = 0; i < AP_MAX && enemyAp > 0 && combat.playerHp > 0; i++) {
        await sleep(settings.difficulty === "hard" ? 280 : 380);
        const move = pickEnemyMove();
        if (!move) {
          const poke = Math.max(1, Math.round(enemyAtkForFloor(run.floor) * diffStats().atkMul * 0.6 * atkScale));
          dealDamageToPlayer(poke);
          applyArchetypePassiveOnHit();
          if (combat.eliteKit && combat.eliteKit.onHit) combat.eliteKit.onHit();
          setLog(`${combat.enemyName} attacks · ${poke} dmg`);
          enemyAp--;
          refreshCombatUI();
          maybePlayerLowVoice();
          continue;
        }

        // Preview glow on tiles rival will swap
        const a = getCell(move.r1, move.c1);
        const b = getCell(move.r2, move.c2);
        a.classList.add("highlight");
        b.classList.add("highlight");
        setLog("Rival found a move…");
        await sleep(320);
        a.classList.remove("highlight");
        b.classList.remove("highlight");

        const { r1, c1, r2, c2 } = move;
        const tmp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = tmp;
        const ts = specials[r1][c1];
        specials[r1][c1] = specials[r2][c2];
        specials[r2][c2] = ts;
        rebuildVisual();

        const { any } = findMatches();
        if (any) {
          enemyAp--;
          await resolveBoardEnemy();
        } else {
          board[r2][c2] = board[r1][c1];
          board[r1][c1] = tmp;
          specials[r2][c2] = specials[r1][c1];
          specials[r1][c1] = ts;
          rebuildVisual();
          if (settings.difficulty !== "easy" && Math.random() < 0.35) {
            const poke = Math.max(1, Math.round(enemyAtkForFloor(run.floor) * diffStats().atkMul * 0.45 * atkScale));
            dealDamageToPlayer(poke);
            applyArchetypePassiveOnHit();
            if (combat.eliteKit && combat.eliteKit.onHit) combat.eliteKit.onHit();
            setLog(`${combat.enemyName} attacks · ${poke} dmg`);
            enemyAp--;
            maybePlayerLowVoice();
          } else {
            setLog(`${combat.enemyName} missed a match`);
          }
        }
        refreshCombatUI();
      }

      if (gameOver) {
        busy = true;
        return;
      }

      combat.ap = AP_MAX + unusedApBonus;
      unusedApBonus = 0; // Reset for this turn
      combat.turn += 1;
      combat.playerTurn = true;

      // Decay timed statuses
      if (combat.afterglowTurns > 0) combat.afterglowTurns--;
      if (combat.manaLockTurns > 0) combat.manaLockTurns--;
      if (combat.mortalWoundTurns > 0) combat.mortalWoundTurns--;
      if (combat.fractureTurns > 0) {
        combat.fractureTurns--;
        if (combat.fractureTurns <= 0) combat.fractureStacks = 0;
      }

      // Knight Regeneration at start of own turn
      if (combat.playerClass === "knight" && combat.playerHp > 0) {
        applyHealing(3);
      }

      // Poison ticks
      if (combat.poisonTurns > 0) {
        dealDamageToPlayer(3);
        combat.poisonTurns--;
      }
      if (combat.enemyPoisonTurns > 0) {
        dealDamageToEnemy(3, { trueDmg: true });
        combat.enemyPoisonTurns--;
      }

      refreshCombatUI();
      await sleep(450);
      if (combat.turn === 6) setLog("⭐ Star Fever begins — signature ×2");
      else if (combat.turn === 11) setLog("☄️ Star Impact — mystery always buffs");
      else setLog("Your turn · " + phaseLabel());
      busy = false;
    }

    // Enemy-side board resolve (matches help the rival)
    async function resolveBoardEnemy() {
      while (true) {
        let { mark, any, specialSpawns } = findMatches();
        if (!any) {
          combo = 0;
          clearComboTheater();
          break;
        }
        const matchedList = [];
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (mark[r][c]) matchedList.push({ r, c, type: board[r][c] });

        const shape = analyzeShapes(mark);
        applyMatchCombat(matchedList, true, shape);

        // Same visible feedback as player
        for (const { r, c } of matchedList) {
          getCell(r, c).classList.add("highlight");
        }
        await sleep(360);
        for (const { r, c, type } of matchedList) {
          const el = getCell(r, c);
          el.classList.remove("highlight");
          el.classList.add("matching");
          spawnParticles(r, c, type);
        }
        await sleep(280);
        for (const { r, c } of matchedList) {
          board[r][c] = null;
          specials[r][c] = false;
          const el = getCell(r, c);
          el.classList.remove("matching");
          el.style.opacity = "0";
        }
        for (const s of specialSpawns) {
          if (s.type && mark[s.r] && mark[s.r][s.c]) {
            board[s.r][s.c] = s.type;
            specials[s.r][s.c] = true;
          }
        }
        await applyGravityAndFill();
      }
    }

    // Helper function to apply healing with overflow-to-damage mechanic
    function applyHealing(amt, healCount = 0) {
      const healed = Math.min(amt, combat.playerMaxHp - combat.playerHp);
      combat.playerHp += healed;
      // Overflow: any healing beyond max HP becomes damage equal to the number of potion tiles matched
      const overflow = amt - healed;
      if (overflow > 0) {
        dealDamageToEnemy(healCount);
      }
      return healed;
    }

    // Helper function to apply shielding with overflow-to-damage mechanic
    function applyShielding(amt, shieldCount = 0) {
      const hero = HERO_STATS[combat.playerClass] || HERO_STATS.ninja;
      const maxSh = hero.maxShieldCap + run.bonusShieldMax;
      const shielded = Math.min(amt, maxSh - combat.shield);
      combat.shield += shielded;
      // Overflow: any shield beyond max becomes damage equal to the number of shield tiles matched
      const overflow = amt - shielded;
      if (overflow > 0) {
        dealDamageToEnemy(shieldCount);
      }
      return shielded;
    }

    // Enemy heals are clamped so a dead enemy can never be resurrected
    function healEnemy(amt) {
      if (combat.enemyHp <= 0 || amt <= 0) return 0;
      const healed = Math.min(amt, combat.enemyMaxHp - combat.enemyHp);
      combat.enemyHp += healed;
      return healed;
    }

    function showUltDamagePop(dmg, cls) {
      const wrap = document.querySelector(".board-wrap");
      if (!wrap) return;
      const pop = document.createElement("div");
      pop.className = `score-popup ult-pop ${cls}`;
      pop.textContent = `−${dmg}`;
      wrap.appendChild(pop);
      setTimeout(() => pop.remove(), 900);
    }

    function runUltFlash(cls) {
      const wrap = document.querySelector(".board-wrap");
      if (!wrap) return;
      const flash = document.createElement("div");
      flash.className = `ult-flash ${cls}`;
      wrap.appendChild(flash);
      // force reflow then animate
      void flash.offsetWidth;
      flash.classList.add("go");
      setTimeout(() => flash.remove(), 600);
    }

    async function useUltimate() {
      if (!ultReady() || busy || !combat.playerTurn) return;
      if (combat.ap <= 0) {
        setLog("Need 1 AP for ultimate");
        return;
      }
      busy = true;
      combat.ap -= 1;
      const charge = combat.sigBank;
      const dmg = 12 + Math.max(0, charge - 6) * 2;
      const cls = combat.playerClass;
      const bits = [];
      const playerPort = document.getElementById("playerPortrait");
      const enemyPort = document.getElementById("enemyPortrait");

      // --- Wind-up ---
      if (playerPort) {
        playerPort.classList.remove("ult-ready");
        playerPort.classList.add("ult-cast");
      }
      playUltSfx(cls);
      await sleep(cls === "knight" ? 140 : 110);

      // Class-specific pre-impact
      if (cls === "ninja") {
        combat.playerHp = Math.max(1, combat.playerHp - 3);
        combat.afterglowTurns = 1;
        bits.push("Assassinate", `${dmg} true`, "Afterglow", "-3 HP");
        refreshCombatUI();
      } else if (cls === "wizard") {
        bits.push("Meteor", `${dmg} true`);
      } else if (cls === "knight") {
        combat.fractureStacks = Math.min(5, combat.fractureStacks + 2);
        combat.fractureTurns = Math.max(combat.fractureTurns, 2);
        combat.mortalWoundTurns = Math.max(combat.mortalWoundTurns, 2);
        bits.push("Earthshatter", `${dmg} true`, `Fracture ${combat.fractureStacks}`, "Mortal Wound");
      } else {
        bits.push("Ultimate", `${dmg} dmg`);
      }

      // --- Hit-stop + flash + flinch ---
      document.body.classList.add("ult-hitstop");
      runUltFlash(cls);
      if (enemyPort) {
        enemyPort.classList.remove("ult-flinch");
        void enemyPort.offsetWidth;
        enemyPort.classList.add("ult-flinch");
      }
      dealDamageToEnemy(dmg, { trueDmg: true });
      showUltDamagePop(dmg, cls);
      combat.sigBank = 0;
      combat.ultAnnounced = false;
      setLog(bits.join(" · "));
      refreshCombatUI();

      await sleep(cls === "knight" ? 240 : 200);
      document.body.classList.remove("ult-hitstop");

      // --- Board residue ---
      let residueNote = "";
      if (cls === "ninja") {
        const n = convertRandomTiles(3, "sword");
        if (n > 0) residueNote = `${n}→⚔️`;
      } else if (cls === "wizard") {
        const n = convertRandomTiles(3, "shield");
        if (n > 0) residueNote = `${n}→🛡️`;
        // Small mana steal if enemy has shield
        if (combat.enemyShield > 0) {
          const steal = Math.min(3, combat.enemyShield);
          combat.enemyShield -= steal;
          applyShielding(steal);
          residueNote = (residueNote ? residueNote + " · " : "") + `steal ${steal}🛡️`;
        }
      } else if (cls === "knight") {
        const n = convertRandomTiles(2, "hp");
        if (n > 0) residueNote = `${n}→❤️`;
      }
      if (residueNote) {
        setLog(bits.join(" · ") + " · " + residueNote);
      }
      refreshCombatUI();

      // Rival voice
      await sleep(160);
      if (!gameOver) sayVoice("playerUlt", { force: true });

      if (playerPort) {
        setTimeout(() => playerPort.classList.remove("ult-cast"), 100);
      }
      if (enemyPort) {
        setTimeout(() => enemyPort.classList.remove("ult-flinch"), 450);
      }

      checkGameOver();
      busy = false;
    }

    }, 200);

});

    function claimFloorReward() {
      const f = run.floor;
      if (run.rewardsClaimed[f]) return null;
      const reward = BOSS_REWARDS[f] || GAUNTLET_REWARDS[f];
      if (!reward) return null;
      run.rewardsClaimed[f] = true;
      reward.apply();
      return reward.label;
    }

    function showFloorBanner() {
      const ov = document.getElementById("floorBannerOverlay");
      const kicker = document.getElementById("floorBannerKicker");

      let kick = "Floor";

      if (BOSS_KITS[run.floor]) {
        kick = "Boss Floor";
        extra = BOSS_KITS[run.floor].name;
      } else if (isEliteFloor(run.floor)) {
        kick = "Elite Floor";
        extra = (ELITE_KITS[run.floor] && ELITE_KITS[run.floor].name) || "Powerful foe";
      }
      kicker.textContent = kick;
      title.textContent = String(run.floor);

    function checkGameOver() {
      if (gameOver) return;
      if (combat.enemyHp <= 0) {
        gameOver = true;
        busy = true;
        const rewardLabel = claimFloorReward();
        if (run.floor >= MAX_FLOOR) {
          document.getElementById("gameOverTitle").textContent = "Campaign Clear!";
          document.getElementById("gameOverMsg").textContent = `All ${MAX_FLOOR} floors conquered.`;
          document.getElementById("rewardMsg").textContent = rewardLabel || "🏆 Victory";
          document.getElementById("btnGoRetry").textContent = "Menu";
          clearSave();
        } else {
          document.getElementById("gameOverTitle").textContent = `Floor ${run.floor} Clear`;
          document.getElementById("gameOverMsg").textContent = BOSS_REWARDS[run.floor]
            ? "Boss defeated!"
            : isEliteFloor(run.floor)
              ? "Elite defeated!"
              : "Rival defeated.";
          document.getElementById("rewardMsg").textContent = rewardLabel
            ? `🎁 Permanent: ${rewardLabel}`
            : "";
          document.getElementById("btnGoRetry").textContent = "Next Floor";
          const savedFloor = run.floor;
          run.floor = savedFloor + 1;
          saveRun();
          run.floor = savedFloor;
        }
        sayVoice("victory", { force: true });
        gameOverOverlay.classList.add("open");
      } else if (combat.playerHp <= 0) {
        gameOver = true;
        busy = true;
        document.getElementById("gameOverTitle").textContent = "Defeat";
        document.getElementById("gameOverMsg").textContent = `Fell on floor ${run.floor}.`;
        document.getElementById("rewardMsg").textContent = "";
        document.getElementById("btnGoRetry").textContent = "Retry Floor";
        saveRun(); // resume same floor
        sayVoice("defeat", { force: true });
        gameOverOverlay.classList.add("open");
      }
    }

    const SAVE_KEY = "puzzleGridRun_v1";

    function saveRun() {
      try {
        const data = {
          floor: run.floor,
          bonusMaxHp: run.bonusMaxHp,
          bonusShieldMax: run.bonusShieldMax,
          bonusApMax: run.bonusApMax,
          rewardsClaimed: run.rewardsClaimed,
          playerClass: combat.playerClass,
          difficulty: settings.difficulty
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      } catch (_) {}
    }

    function loadRun() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (_) {
        return null;
      }
    }

    function clearSave() {
      try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
    }

    function hasSave() {
      const d = loadRun();
      return d && d.floor >= 1 && d.floor <= MAX_FLOOR;
    }

    function refreshContinueBtn() {
      const btn = document.getElementById("btnContinue");
      const span = document.getElementById("continueFloor");
      if (!btn) return;
      if (hasSave()) {
        const d = loadRun();
        btn.style.display = "";
        if (span) span.textContent = String(d.floor);
      } else {
        btn.style.display = "none";
      }
    }

    function resetRun() {
      run.floor = 1;
      run.bonusMaxHp = 0;
      run.bonusShieldMax = 0;
      run.bonusApMax = 0;
      run.rewardsClaimed = {};
      AP_MAX = 3;
      clearSave();
    }

    function applyLoadedRun(d) {
      run.floor = Math.max(1, Math.min(MAX_FLOOR, d.floor | 0));
      run.bonusMaxHp = d.bonusMaxHp | 0;
      run.bonusShieldMax = d.bonusShieldMax | 0;
      run.bonusApMax = d.bonusApMax | 0;
      run.rewardsClaimed = d.rewardsClaimed || {};
      AP_MAX = 3 + run.bonusApMax;
      if (d.playerClass && HERO_STATS[d.playerClass]) combat.playerClass = d.playerClass;
      if (d.difficulty) settings.difficulty = d.difficulty;
    }

    function startBattle(opts = {}) {
      // opts.fromVictory = true → advance floor; opts.retry = stay on floor
      if (opts.fromVictory) {
        if (run.floor >= MAX_FLOOR) {
          resetRun();
          showScreen("menu");
          buildCharPick();
          return;
        }
        run.floor += 1;
      }
      // defeat retry keeps same floor; fresh start from menu resets via resetRun

      const hero = HERO_STATS[combat.playerClass] || HERO_STATS.ninja;
      const maxHp = hero.hp + run.bonusMaxHp;
      const maxSh = hero.maxShieldCap + run.bonusShieldMax;
      AP_MAX = 3 + run.bonusApMax;

      gameOver = false;
      gameOverOverlay.classList.remove("open");
      combat.playerMaxHp = maxHp;
      combat.playerHp = maxHp;
      combat.shield = Math.min(maxSh, hero.startShield);
      combat.enemyShield = 0;
      combat.sigBank = 0;
      combat.ap = AP_MAX;
      combat.turn = 1;
      combat.playerTurn = true;
      combat.empowerNext = false;
      combat.blindNext = false;
      combat.weakenNextSword = false;
      combat.poisonTurns = 0;
      combat.enemyPoisonTurns = 0;
      combat.firstHitDodged = false;
      combat.afterglowTurns = 0;
      combat.markStacks = 0;
      combat.fractureStacks = 0;
      combat.fractureTurns = 0;
      combat.mortalWoundTurns = 0;
      combat.manaLockTurns = 0;
      combat.logHistory = [];
      combat.ultAnnounced = false;
      combat.enemyUltCharge = 0;
      combat.bossKit = BOSS_KITS[run.floor] || null;
      combat.eliteKit = ELITE_KITS[run.floor] || null;
      combat.enemyUltNeed = combat.bossKit ? combat.bossKit.ultTurns : 4;
      combat.enemyArchetype = (combat.bossKit || combat.eliteKit) ? null : pickEnemyArchetype(run.floor);
      combat.enemySpecialCharge = 0;
      combat.enemySpecialNeed = 4 + Math.floor(Math.random() * 2); // 4 or 5
      busy = false;

      // Single enemy setup (boss / elite / normal)
      const arch = combat.enemyArchetype;
      const elite = combat.eliteKit;
      let unitHp = enemyHpForFloor(run.floor);
      if (elite) unitHp = Math.round(unitHp * (elite.hpMul || 1.5));
      else if (arch) unitHp = Math.round(unitHp * (arch.hpMul || 1));

      if (combat.bossKit) {
        combat.enemyFullName = combat.bossKit.name;
        combat.enemyName = displayEnemyName(combat.bossKit.name);
      } else if (elite) {
        combat.enemyFullName = elite.name;
        combat.enemyName = displayEnemyName(elite.name);
      } else {
        const nm = randomEnemyName();
        combat.enemyFullName = nm;
        combat.enemyName = nm;
      }
      combat.enemyMaxHp = unitHp;
      combat.enemyHp = unitHp;
      combat.enemyShield = arch && arch.startShield ? arch.startShield : 0;

      const floorEl = document.getElementById("floorNum");
      if (floorEl) floorEl.textContent = String(run.floor);

      build();
      setupFighters();
      document.getElementById("enemyName").textContent = combat.enemyName;
      refreshCombatUI();
      const floorNote = combat.bossKit
        ? " · BOSS"
        : elite
          ? " · ELITE"
          : "";
      setLog(`Floor ${run.floor}${floorNote} · ${combat.enemyName}`);
      saveRun();
      showScreen("game");
      showFloorBanner();
      // Trash talk after floor banner settles
      setTimeout(() => {
        if (!gameOver && combat.playerTurn) {
          // Occasional class jab on later floors
          if (run.floor >= 3 && Math.random() < 0.22) {
            sayVoice("classJab", { force: true });
          } else {
            sayVoice("floorStart", { force: true });
          }
        }
      }, 1500);
    }

    function heroInfoHtml(cls) {
      const s = HERO_STATS[cls] || HERO_STATS.ninja;
      const sig = SIGNATURE[cls];
      const sigLabel = { sword: "⚔️ Sword", shield: "🛡️ Shield", hp: "❤️ Potion" }[sig] || sig;
      let passive = "", ult = "", shapes = "";

        passive = "First hit always dodged. Then 20% dodge. Sword matches heal 2 HP (4 on Charged).";

        shapes = "⭐ +2 AP + 3→Sword · 💥 Mark (+15% dmg taken) · ⚡ +4 HP";

        <div class="info-section">Passive</div>
        <div class="info-body">${passive}</div>
        <div class="info-section">Ultimate</div>
        <div class="info-body">${ult}</div>
        <div class="info-section">Shape bonuses</div>

    function statusSummaryPlayer() {
      const parts = [];
      if (combat.afterglowTurns > 0) parts.push(`Afterglow ${combat.afterglowTurns}t`);
      if (combat.poisonTurns > 0) parts.push(`Poison ${combat.poisonTurns}t`);
      if (combat.empowerNext) parts.push("Empower");
      if (combat.blindNext) parts.push("Blind");
      if (combat.weakenNextSword) parts.push("Weaken");
      if (combat.shield > 0) parts.push(`Shield ${combat.shield}`);
      return parts.length ? parts.join(" · ") : "None";
    }

    function statusSummaryEnemy() {
      const parts = [];
      if (combat.markStacks > 0) parts.push(`Mark ${combat.markStacks}`);
      if (combat.fractureStacks > 0) parts.push(`Fracture ${combat.fractureStacks} (${combat.fractureTurns}t)`);
      if (combat.mortalWoundTurns > 0) parts.push(`Mortal Wound ${combat.mortalWoundTurns}t`);
      if (combat.manaLockTurns > 0) parts.push(`Mana Lock ${combat.manaLockTurns}t`);
      if (combat.enemyPoisonTurns > 0) parts.push(`Poison ${combat.enemyPoisonTurns}t`);
      if (combat.enemyShield > 0) parts.push(`Shield ${combat.enemyShield}`);
      return parts.length ? parts.join(" · ") : "None";
    }

    function enemyInfoHtml() {
  let encounter = "Normal foe";
  let details = "";
  let passiveDetails = "";
  let specialDetails = "";
  let ultDetails = "";

  // ---- BOSS ----
  if (combat.bossKit) {
    const kit = combat.bossKit;
    encounter = "👑 Boss";
    const dmgMult = kit.ultFn.toString().match(/\* (\d+\.?\d*)/);
    const dmgPercent = dmgMult ? Math.round(parseFloat(dmgMult[1]) * 100) : "???";
    ultDetails = `
      <div class="info-section">⚔️ Ultimate</div>
      <div class="info-body">
        <strong>${kit.ultName}</strong><br>
        • Charges in <strong>${kit.ultTurns}</strong> turns<br>
        • Deals <strong>${dmgPercent}%</strong> base damage<br>
        • ${kit.ultFn.toString().replace(/[{}]/g, '').replace(/setLog\(["']([^"']*)["']\)/g, '→ $1').split(';')[0] || 'Powerful effect'}
      </div>
    `;
  }

  // ---- ELITE ----
  if (combat.eliteKit) {
    const kit = combat.eliteKit;
    encounter = "⚡ Elite";
    let passiveText = kit.passive || "None";
    let onHitText = "";
    if (kit.onHit) {
      const fnStr = kit.onHit.toString();
      if (fnStr.includes('combat.enemyHp = Math.min(combat.enemyMaxHp, combat.enemyHp + 4)')) {
        onHitText = " • Lifesteal +4 HP on hit";
      } else if (fnStr.includes('dealDamageToPlayer(Math.max(2, Math.round(enemyAtkForFloor(19) * 0.35)))')) {
        onHitText = " • Chain Shock: extra 35% damage on hit";
      } else if (fnStr.includes('combat.poisonTurns = Math.max(combat.poisonTurns || 0, 2)')) {
        onHitText = " • Applies Poison (2 turns) on hit";
      } else if (fnStr.includes('combat.enemyShield = Math.min(25, combat.enemyShield + 3)')) {
        onHitText = " • Gains +3 Shield when damaged";
      }
    }
    passiveDetails = `
      <div class="info-section">🛡️ Elite Passive</div>
      <div class="info-body">${passiveText}${onHitText}</div>
    `;
  }

  // ---- NORMAL ARCHETYPE ----
  if (combat.enemyArchetype) {
    const arch = combat.enemyArchetype;
    encounter = `🎯 ${arch.label}`;
    let passiveDesc = arch.passive || "None";
    if (arch.id === "viper") passiveDesc = "45% chance to apply Poison (2 turns) on hit";
    else if (arch.id === "hexer") passiveDesc = "40% chance to apply Blind OR Weaken on hit";
    else if (arch.id === "mender") passiveDesc = `Heals ~${Math.round(3 + run.floor * 0.15)} HP at turn start`;
    else if (arch.id === "bruiser") passiveDesc = "Heavy hits – +25% damage";
    else if (arch.id === "raider") passiveDesc = "Glass cannon – +35% damage, -10% HP";
    passiveDetails = `
      <div class="info-section">🛡️ Archetype Passive</div>
      <div class="info-body">${passiveDesc}</div>
    `;
  }

  // ---- POWER STRIKE (all normal enemies) ----
  if (!combat.bossKit && !combat.eliteKit) {
    const chargeTime = combat.enemySpecialNeed || "4-5";
    specialDetails = `
      <div class="info-section">💥 Special Move</div>
      <div class="info-body">
        <strong>Power Strike</strong><br>
        • Charges in <strong>${chargeTime}</strong> turns<br>
        • Deals <strong>150%</strong> base damage<br>
        • Warning: "Enemy is charging a special..." appears 1 turn before
      </div>
    `;
  }

  // ---- ENEMY ATTACK SCALING ----
  const atkNow = enemyAtkForFloor(run.floor);
  const atkNext = enemyAtkForFloor(run.floor + 1);
  const scalingInfo = `
    <div class="info-section">📈 Attack Scaling</div>
    <div class="info-body">
      Base: ${settings.enemyAtk} + (Floor-1) × 0.6<br>
      Current: <strong>~${atkNow}</strong> damage<br>
      Next floor: ~${atkNext} damage
    </div>
  `;

  // ---- BUILD FINAL HTML ----
  return `
    <div class="info-row"><span>Name</span><span>${combat.enemyFullName || combat.enemyName || "Rival"}</span></div>
    <div class="info-row"><span>HP</span><span>${combat.enemyHp}/${combat.enemyMaxHp}</span></div>
    <div class="info-row"><span>Floor</span><span>${run.floor}</span></div>
    <div class="info-row"><span>Type</span><span>${encounter}</span></div>
    <div class="info-row"><span>Attack</span><span>~${atkNow} damage</span></div>
    ${passiveDetails}
    ${specialDetails}
    ${ultDetails}
    ${scalingInfo}
    <div class="info-section">📊 Statuses on this foe</div>
    <div class="info-body">${statusSummaryEnemy()}</div>
  `;
}

    function openInfo(who) {
      if (who === "player") {
        infoTitle.textContent = (HERO_STATS[combat.playerClass] || {}).name || "Hero";
        infoBody.innerHTML = heroInfoHtml(combat.playerClass);
      } else {
        infoTitle.textContent = combat.enemyFullName || combat.enemyName || "Enemy";
        infoBody.innerHTML = enemyInfoHtml();
      }
      infoOverlay.classList.add("open");
    }

    function bindHold(el, who) {
      if (!el) return;
      const start = e => {
        if (holdTimer) clearTimeout(holdTimer);
        holdTarget = who;
        holdTimer = setTimeout(() => {
          holdTimer = null;
          openInfo(who);
        }, 420);
      };
      const cancel = () => {
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      };
      el.addEventListener("pointerdown", start);
      el.addEventListener("pointerup", cancel);
      el.addEventListener("pointerleave", cancel);
      el.addEventListener("pointercancel", cancel);
    }

    bindHold(playerPortraitEl, "player");
    bindHold(document.getElementById("enemyPortrait"), "enemy");

    // Short click on player still triggers ult; long press opens info
    // (hold cancels before click fires if we prevent default on long press — skip for simplicity)

    document.getElementById("btnInfoClose").addEventListener("click", () => {
      infoOverlay.classList.remove("open");
    });
    infoOverlay.addEventListener("click", e => {
      if (e.target === infoOverlay) infoOverlay.classList.remove("open");
    });

    // Phase event pill → info
    const phasePillEl = document.getElementById("phasePill");
    if (phasePillEl) {
      phasePillEl.addEventListener("click", () => {
        if (getPhase() === "normal") return;
        playUiClick("tap");
        showPhaseInfo();
      });
    }

    // UI click SFX + haptic for every button
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.disabled) return;
      if (btn.id === "btnEnd") playUiClick("end");
      else if (btn.classList.contains("primary") || btn.classList.contains("end-btn")) playUiClick("primary");
      else playUiClick("tap");
    }, true);

    // ---------- start ----------
    buildCharPick();
    refreshContinueBtn();
    showScreen("menu");
  </script>
</body>
</html>
